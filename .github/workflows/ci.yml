name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-guards:
    name: Deterministic safety guards
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deterministic guard tests (no LLM, no Ollama)
        run: pytest tests -v